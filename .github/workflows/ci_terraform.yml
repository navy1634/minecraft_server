name: CI for terraform
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
    paths:
      - "*"
      - ".github/workflows/ci_terraform.yml"
      - "!terraform/README.md"

env:
  env: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'dev' }}
  environment: ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'development' }}
  AWS_PROFILE_ACCOUNT: default
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.15.5
  TFCMT_VERSION: 4.14.15
  TFLINT_VERSION: 0.63.1

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  check:
    name: check ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Terraform setup
        uses: ./.github/actions/setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfcmt_version: v${{ env.TFCMT_VERSION }}
          aws_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws_profile: ${{ env.AWS_PROFILE_ACCOUNT }}
          region: ${{ env.AWS_REGION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform TFLint
        run: |
          tflint --init
          tflint --config=${{ github.workspace }}/.tflint.hcl --recursive

      - name: commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: auto format by CI"
          file_pattern: "*"

      - name: Render terraform docs and push changes back to PR
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          git-push: "true"

  plan:
    needs: check
    name: plan ${{ github.event.pull_request.base.ref == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'dev' }}

    defaults:
      run:
        working-directory: env/${{ github.event.pull_request.base.ref == 'main' && 'prd' || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform setup
        uses: ./.github/actions/setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfcmt_version: v${{ env.TFCMT_VERSION }}
          aws_role_arn: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws_profile: ${{ env.AWS_PROFILE_ACCOUNT }}
          region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: tfcmt -var 'target:${{ env.environment }}' plan -patch -- terraform plan -no-color
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
